# wandb のハイパーパラメータ探索（sweep）。課題で使う。
#
# 使い方:
#   wandb sweep sweep.yaml           # sweep を作成（表示される sweep ID を控える）
#   qsub -g tga-hpc-lecture job.sh <ENTITY/kenkyu_project/SWEEP_ID>   # エージェントを投入
#
# method は bayes（少ない試行で良い組み合わせを探す）。grid にすると全組み合わせを試す。
program: 14_ddp.py
method: bayes
metric:
  name: val_ppl
  goal: minimize
parameters:
  lr:
    distribution: log_uniform_values
    min: 1.0e-4
    max: 3.0e-3
  n_layer:
    values: [4, 6, 8]
  n_head:
    values: [4, 6, 8]
  n_embd:
    values: [192, 384]
  block_size:
    values: [128, 256]
  dropout:
    values: [0.0, 0.1, 0.2]
  max_iters:
    value: 3000
